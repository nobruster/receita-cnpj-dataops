[project]
name = "receita-cnpj-dataops"
version = "0.1.0"
description = "Plataforma DataOps on-premises para os dados abertos do CNPJ (Receita Federal), com Airflow + dbt + DuckDB + PostgreSQL + MCP + CrewAI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "duckdb>=1.3,<2",
    "dbt-duckdb>=1.9",
    "mcp>=1.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "crewai>=1.10,<2",
]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
